<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F6FF" />
    <title>404 - Page Not Found | Mrwan H.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #F8F6FF;
        background-image: 
          linear-gradient(to right, rgba(24, 24, 27, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(24, 24, 27, 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        color: #18181B;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
      }
      header a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 24px;
        text-decoration: none;
        color: #18181B;
      }
      header a span.star {
        color: #2F5BFF;
      }
      main {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .card {
        background: #FFFFFF;
        border: 3px solid #18181B;
        border-radius: 24px;
        box-shadow: 6px 6px 0 #18181B;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: #FFD200;
        border: 3px solid #18181B;
        border-radius: 9999px;
        box-shadow: 4px 4px 0 #18181B;
        font-weight: 700;
        font-size: 14px;
        transform: rotate(-2deg);
        margin-bottom: 24px;
      }
      h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.04em;
        margin-bottom: 16px;
      }
      p {
        color: #52525B;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.5;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 32px;
        background: #2F5BFF;
        color: #FFFFFF;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        border: 3px solid #18181B;
        border-radius: 9999px;
        box-shadow: 4px 4px 0 #18181B;
        text-decoration: none;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #18181B;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #18181B;
      }
      footer {
        text-align: center;
        font-size: 12px;
        color: #52525B;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">
        <span>Mrwan H.</span>
        <span class="star">✦</span>
      </a>
    </header>
    <main>
      <div class="card">
        <div class="badge">
          <span>✦</span>
          <span>404 - Not Found</span>
        </div>
        <h1>404</h1>
        <p>Oops! This screen got lost in wireframing.</p>
        <a href="/" class="btn">
          <span>Back Home</span>
          <span>→</span>
        </a>
      </div>
    </main>
    <footer>
      © 2026 Mrwan H. ✦ UI/UX Designer
    </footer>
  </body>
</html>
